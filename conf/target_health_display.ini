; Target Health Display
; 配置唯一位置：MHGU 当前用户的存档根目录 /target_health_display.ini
; 缺少文件时自动生成；Forge 菜单和手动编辑保存到同一文件。
; 位置按 1280×720 填写，颜色写 #RRGGBBAA。
[bar]
enabled = true
show_other_areas = true
x = 760
y = 45
width = 303
height = 24
rounding = 4
border_width = 1
opacity = 1
fill_color = #50DC6EEB
background_color = #0F1419BE
border_color = #E6E6E6E6
low_hp_color = #FF5A46EB
low_hp_threshold = 25

[text]
show_values = true
show_max = true
show_percent = true
font_size = 17
font_file = default
color = #FFFFFFFF
outline_color = #000000E6
outline_width = 1
position = below
offset_x = 150
offset_y = 1

[info]
; 各项横向排列在同一行；名称和种类使用游戏当前语言。
show_name = true
show_crown = true
show_species = false
show_enraged = true
show_scale = false
show_size = false
font_size = 18
; below 放在血条下方；above 放在上方。偏移仍按 1280×720 填写。
position = below
offset_x = 0
offset_y = 2
; 信息行与血条之间的间隔；不因血量数字的位置自动换行。
line_spacing = 4
color = #FFFFFFFF
